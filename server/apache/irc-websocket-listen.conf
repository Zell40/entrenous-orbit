# Vhost irc.entrenous.chat — websocket InspIRCd
#
# Fichier live (ne pas renommer) :
#   /etc/apache2/sites-available/kiwiirc.websocket.irc.conf
# Remplacer le contenu de ce vhost (garder le nom).
#
# Ports InspIRCd (connectv4.conf) :
#   8107 = WebsocketEN (normal)
#   8197 = Websocket-CP (contrôle parental)
#
# Cookie orbit_en_listen=cp|reg posé par handoff.php (Domain=.entrenous.chat).
# Le navigateur ne peut pas poser d’en-tête custom sur une WebSocket :
# Apache lit Cookie et proxy vers le bon listen.
#
# a2enmod rewrite proxy proxy_http proxy_wstunnel proxy_ssl headers ssl
# apache2ctl configtest && systemctl reload apache2

<VirtualHost *:80>
    ServerName irc.entrenous.chat
    ServerAdmin webmaster@entrenous.chat

    RewriteEngine On
    RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [R=301,L]
</VirtualHost>

<VirtualHost *:443>
    ServerName irc.entrenous.chat

    SSLEngine on
    SSLCertificateFile /etc/apache2/ssl/entrenous.pem
    SSLCertificateKeyFile /etc/apache2/ssl/entrenous.chat.key

    RequestHeader set Sec-WebSocket-Protocol "text.ircv3.net"

    ProxyPreserveHost On
    ProxyRequests Off

    # Backend InspIRCd en wss:// local (cert auto-signé)
    SSLProxyEngine On
    SSLProxyVerify none
    SSLProxyCheckPeerCN off
    SSLProxyCheckPeerName off
    SSLProxyCheckPeerExpire off

    RewriteEngine On

    # Cookie → en-tête backend (logs / debug)
    SetEnvIf Cookie "orbit_en_listen=cp" EN_LISTEN=cp
    SetEnvIf Cookie "orbit_en_listen=reg" EN_LISTEN=reg
    RequestHeader unset X-EN-Listen
    RequestHeader set X-EN-Listen "%{EN_LISTEN}e" env=EN_LISTEN

    # HTTP (pas un websocket) → webapp Kiwi
    RewriteCond %{HTTP:Upgrade} !=websocket [NC]
    RewriteRule ^ https://webapp.entrenous.chat/ [R=302,L]

    # WebSocket contrôle parental (InspIRCd Websocket-CP)
    RewriteCond %{HTTP:Upgrade} =websocket [NC]
    RewriteCond %{HTTP_COOKIE} (?:^|;\s*)orbit_en_listen=cp(?:;|$)
    RewriteRule ^/?(.*)$ wss://127.0.0.1:8197/$1 [P,L]

    # WebSocket normal (InspIRCd WebsocketEN) — défaut, cookie absent inclus
    RewriteCond %{HTTP:Upgrade} =websocket [NC]
    RewriteRule ^/?(.*)$ wss://127.0.0.1:8107/$1 [P,L]
</VirtualHost>
