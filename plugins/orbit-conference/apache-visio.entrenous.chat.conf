# Apache reverse proxy for Jitsi Meet Docker
# Destination: HTTP_PORT of docker-jitsi-meet (often 5000 or 8000)
#
# Required .env on the Jitsi host:
#   PUBLIC_URL=https://visio.entrenous.chat
#   DISABLE_HTTPS=1
#   ENABLE_XMPP_WEBSOCKET=1
#   JVB_ADVERTISE_IPS=<IP publique du serveur>
# Firewall: open TCP 443 + UDP 10000 (JVB media — not proxied by Apache)

<VirtualHost *:80>
    ServerName visio.entrenous.chat
    Redirect permanent / https://visio.entrenous.chat/
</VirtualHost>

<VirtualHost *:443>
    ServerName visio.entrenous.chat

    SSLEngine on
    SSLCertificateFile      /etc/letsencrypt/live/visio.entrenous.chat/fullchain.pem
    SSLCertificateKeyFile   /etc/letsencrypt/live/visio.entrenous.chat/privkey.pem
    Include /etc/letsencrypt/options-ssl-apache.conf

    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port "443"
    ProxyTimeout 900

    # WebSockets MUST be listed BEFORE the catch-all /
    # (XMPP signaling + Colibri — without these, Meet reconnects forever)
    ProxyPass        /xmpp-websocket  ws://127.0.0.1:5000/xmpp-websocket
    ProxyPassReverse /xmpp-websocket  ws://127.0.0.1:5000/xmpp-websocket

    ProxyPass        /colibri-ws/     ws://127.0.0.1:5000/colibri-ws/
    ProxyPassReverse /colibri-ws/     ws://127.0.0.1:5000/colibri-ws/

    ProxyPass        / http://127.0.0.1:5000/
    ProxyPassReverse / http://127.0.0.1:5000/

    ErrorLog  ${APACHE_LOG_DIR}/visio.entrenous.chat-error.log
    CustomLog ${APACHE_LOG_DIR}/visio.entrenous.chat-access.log combined
</VirtualHost>

# Enable: a2enmod proxy proxy_http proxy_wstunnel ssl headers
#         a2ensite apache-visio.entrenous.chat.conf
#         apache2ctl configtest && systemctl reload apache2
